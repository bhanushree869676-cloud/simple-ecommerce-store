<!DOCTYPE html>
<html>
<head>
    <title>My E-commerce Store</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .product {
            background: white;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
        }

        img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>
<body>

<h1>Welcome to My Online Store</h1>

<div class="products">

{% for product in products %}

<div class="product">

    {% if product.image %}
        <img src="{{ product.image }}" alt="{{ product.name }}">
    {% endif %}

    <h3>{{ product.name }}</h3>

    <p>₹{{ product.price }}</p>

    <a href="{% url 'product_detail' product.id %}">
        View Details
    </a>

</div>

{% empty %}

<p>No products available.</p>

{% endfor %}

</div>

</body>
</html>
